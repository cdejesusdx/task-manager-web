<div class="container py-4" *ngIf="!loading">
  <h2>{{ id ? 'Editar' : 'Crear' }} tarea</h2>

  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="mb-3">
      <label class="form-label">Título</label>
      <input formControlName="title" class="form-control" />
      <div class="text-danger" *ngIf="form.controls.title.invalid && form.touched">
        Título obligatorio (máx 100).
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea formControlName="description" rows="3" class="form-control"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Fecha límite</label>
      <input type="date" formControlName="dueDate" class="form-control" />
    </div>

    <div class="mb-3">
      <label class="form-label">Estado</label>
      <select formControlName="status" class="form-select">
        <option value="Pending">Pendiente</option>
        <option value="InProgress">En progreso</option>
        <option value="Completed">Completada</option>
      </select>
    </div>

    <button class="btn btn-primary" [disabled]="form.invalid">Guardar</button>
    <a routerLink="/tasks" class="btn btn-secondary ms-2">Cancelar</a>
  </form>
</div>

<div class="text-center my-5" *ngIf="loading">
  <div class="spinner-border"></div>
</div>
